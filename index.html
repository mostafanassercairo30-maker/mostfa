<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ساعة حبنا</title>
<meta name="theme-color" content="#b3263e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ساعة حبنا">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
/* Layout: one column. Names, an arch-shaped photo slideshow (birds circle the frame on every change), then two countdown boxes (katb el-ketab, wedding) fixed on top of the hourglass and "time together" fixed under it. Sand drains out of the top boxes, falls grain by grain through the glass and piles up in the bottom box. */
:root {
  --bg: #fbf2f4;
  --fg: #2a1a1f;
  --muted: #7a5d66;
  --panel: #ffffff;
  --line: #ecd5db;
  --accent: #b3263e;
  --accent-soft: #f7dfe4;
  --glass: #b08a94;
  --sand: #e0a15a;
  --sand-deep: #b9702d;
  --frame-hi: #e3c48c; --frame-lo: #a5793c;
  --bird: #6b4a53;
  --font: "Cairo", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1115; --fg: #f6e9ed; --muted: #b99aa4; --panel: #26191e; --line: #43292f;
    --accent: #ef6a82; --accent-soft: #3a1f27; --glass: #8c6670; --sand: #eab36e; --sand-deep: #cf8a45; --frame-hi: #ecd29c; --frame-lo: #b58a49; --bird: #f2d3da;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1115; --fg: #f6e9ed; --muted: #b99aa4; --panel: #26191e; --line: #43292f;
  --accent: #ef6a82; --accent-soft: #3a1f27; --glass: #8c6670; --sand: #eab36e; --sand-deep: #cf8a45; --frame-hi: #ecd29c; --frame-lo: #b58a49; --bird: #f2d3da;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.names { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; text-align: center; }
.names span { font-size: clamp(1.5rem, 7vw, 2.2rem); font-weight: 800; overflow-wrap: anywhere; }
.heart { width: 30px; height: 30px; fill: var(--accent); animation: beat 1.6s ease-in-out infinite; flex: none; }
@keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.18); } 24% { transform: scale(1); } 36% { transform: scale(1.12); } 48% { transform: scale(1); } }

.photoWrap { position: relative; width: min(64vw, 240px); aspect-ratio: 4 / 5; margin-block: 8px; }
.photos { position: absolute; inset: 0; border-radius: 999px 999px 18px 18px; overflow: hidden; border: 3px solid var(--panel); box-shadow: 0 0 0 2px var(--accent); background: var(--accent-soft); cursor: pointer; padding: 0; }
.photos img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.12); filter: blur(7px); transition: opacity 1.1s ease, transform 1.6s ease, filter 1.1s ease; }
.photos img.on { opacity: 1; transform: scale(1); filter: none; }
.photos .dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
.photos .dots i { width: 7px; height: 7px; border-radius: 50%; background: #ffffff; opacity: .5; }
.photos .dots i.on { opacity: 1; }
.birds { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.bird { position: absolute; left: 0; top: 0; width: 30px; height: 20px; opacity: 0; will-change: transform, opacity; }
.bird svg { display: block; fill: var(--bird); overflow: visible; }
.bird .wing { transform-origin: 12px 10px; animation: flap .2s ease-in-out infinite alternate; }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.55); } }

.stage { width: 100%; display: flex; flex-direction: column; }
.box { position: relative; overflow: hidden; background: var(--panel); box-sizing: border-box; }
.box h2 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--muted); text-align: center; }
.box .inner { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; }
.box .fill { position: absolute; inset: auto 0 0 0; height: 0; background: var(--sand); opacity: .4; transition: height .6s ease; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; overflow: hidden; }
.pair .box { padding: 14px 8px 40px; }
.pair .box + .box { border-inline-start: 1px solid var(--line); }
.box.bottom { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 16px 16px; padding: 40px 16px 16px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--accent-soft); border-radius: 10px; padding: 8px 2px; text-align: center; }
.tile b { display: block; font-size: clamp(1.5rem, 8vw, 2.2rem); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1.15; }
.tile span { font-size: .85rem; color: var(--muted); }
.pair .tiles { gap: 5px; }
.pair .tile { padding: 6px 1px; border-radius: 8px; }
.pair .tile b { font-size: clamp(1.1rem, 5.4vw, 1.55rem); }
.pair .tile span { font-size: .7rem; }
.days { text-align: center; font-size: .95rem; color: var(--fg); font-weight: 600; line-height: 1.3; }
.days b { font-size: 1.5rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; margin-inline: 3px; }
.note { margin: 0; text-align: center; color: var(--muted); font-size: .85rem; }
.cpct { text-align: center; font-weight: 800; font-size: 1.25rem; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.2; }
.cpct small { font-weight: 400; font-size: .75rem; color: var(--muted); margin-inline-start: 4px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .6s ease; }
.word { margin: 0; text-align: center; font-weight: 600; font-size: .85rem; line-height: 1.5; color: var(--fg); overflow-wrap: anywhere; }

.glass { display: block; width: 100%; height: 320px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.12)); }
.glass .frame { fill: url(#gFrame); }
.glass .gloss { fill: #ffffff; fill-opacity: .4; }
.glass .body { fill: var(--panel); fill-opacity: .5; }
.glass .shine { fill: none; stroke: #ffffff; stroke-opacity: .6; stroke-width: 4; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.glass .outline { fill: none; stroke: var(--glass); stroke-width: 5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.glass .sand { fill: url(#gSand); }
.glass .stream { stroke: var(--sand-deep); stroke-width: 1.5; stroke-opacity: .55; vector-effect: non-scaling-stroke; }
.glass .grain { fill: var(--sand-deep); }

.drop { position: absolute; left: 50%; width: 6px; height: 30px; margin-left: -3px; background: repeating-linear-gradient(to bottom, var(--sand-deep) 0 4px, transparent 4px 9px); background-size: 100% 9px; animation: pour .5s linear infinite; }
.drop.dn { bottom: 0; }
.drop.up { top: 0; }
@keyframes pour { to { background-position: 0 9px; } }
@media (prefers-reduced-motion: reduce) { .heart, .drop, .bird .wing { animation: none; } .box .fill, .bar i, .photos img { transition: none; } }

details { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-sizing: border-box; }
summary { cursor: pointer; font-weight: 600; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; color: var(--muted); min-width: 0; }
.form input { font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; box-sizing: border-box; min-width: 0; }
.form .full { grid-column: 1 / -1; }
.hint { margin: 10px 0 0; font-size: .85rem; color: var(--muted); }
input:focus-visible, summary:focus-visible, .photos:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 420px) { .form { grid-template-columns: 1fr; } }
</style>

</head>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'love-hourglass-v4';
  var UNITS = ['سنين', 'شهور', 'أيام', 'ساعات', 'دقايق', 'ثواني'];
  var ids = ['in1', 'in2', 'inStart', 'inKK', 'inWed', 'inKKword', 'inWword'];
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (v) ids.forEach(function (id) { if (typeof v[id] === 'string') $(id).value = v[id]; });
    } catch (e) {}
  }
  function save() {
    try {
      var o = {}; ids.forEach(function (id) { o[id] = $(id).value; });
      localStorage.setItem(KEY, JSON.stringify(o));
    } catch (e) {}
  }
  function parts(from, to) {
    var y = to.getFullYear() - from.getFullYear();
    var mo = to.getMonth() - from.getMonth();
    var d = to.getDate() - from.getDate();
    var h = to.getHours() - from.getHours();
    var mi = to.getMinutes() - from.getMinutes();
    var s = to.getSeconds() - from.getSeconds();
    if (s < 0) { s += 60; mi--; }
    if (mi < 0) { mi += 60; h--; }
    if (h < 0) { h += 24; d--; }
    if (d < 0) { d += new Date(to.getFullYear(), to.getMonth(), 0).getDate(); mo--; }
    if (mo < 0) { mo += 12; y--; }
    return [y, mo, d, h, mi, s];
  }
  var ZERO = [0, 0, 0, 0, 0, 0], DAY = 86400000;
  function tiles(el, p) {
    if (el.children.length !== 6) {
      el.innerHTML = UNITS.map(function (u) { return '<div class="tile"><b>0</b><span>' + u + '</span></div>'; }).join('');
    }
    for (var i = 0; i < 6; i++) el.children[i].firstChild.textContent = p[i];
  }
  function parse(v) { var d = new Date(v); return isNaN(d.getTime()) ? null : d; }
  function dateAr(d) { return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }); }
  function clamp(p) { return Math.max(0, Math.min(1, p)); }
  function days(el, word, n) { el.innerHTML = word + '<b>' + n + '</b>يوم'; }

  var state = { pw: 0, pouring: false };

  // one countdown box on top of the glass; returns progress 0..1 from "start" to the event
  function cell(prefix, target, start, now, upTitle, downTitle, word) {
    var titleEl = $(prefix + 'Title'), noteEl = $(prefix + 'Note'), daysEl = $(prefix + 'Days'), p = 0;
    var list = $(prefix === 'kk' ? 'kk' : 'wed');
    if (!target) {
      titleEl.textContent = downTitle; tiles(list, ZERO); noteEl.textContent = 'اختار التاريخ'; daysEl.textContent = '';
    } else if (target > now) {
      titleEl.textContent = downTitle; tiles(list, parts(now, target)); noteEl.textContent = dateAr(target);
      days(daysEl, 'فاضل', Math.ceil((target - now) / DAY));
      if (start && start < target && start <= now) p = (now - start) / (target - start);
    } else {
      p = 1; titleEl.textContent = upTitle; tiles(list, parts(target, now)); noteEl.textContent = 'مبروك! من ' + dateAr(target);
      days(daysEl, 'عدّى', Math.floor((now - target) / DAY));
    }
    p = clamp(p);
    var pouring = p > 0 && p < 1;
    $(prefix + 'Pct').innerHTML = (p * 100).toFixed(pouring ? 2 : 0) + '%<small>' + (p >= 1 ? 'حصل' : 'قطعنا') + '</small>';
    $(prefix + 'Bar').style.width = (p * 100) + '%';
    // sand drains out of the top boxes
    $(prefix === 'kk' ? 'fillKK' : 'fillW').style.height = ((1 - p) * 100) + '%';
    $(prefix === 'kk' ? 'dropKK' : 'dropW').hidden = !pouring;
    $(prefix + 'Word').textContent = word;
    return p;
  }

  function render() {
    $('n1').textContent = $('in1').value.trim() || '...';
    $('n2').textContent = $('in2').value.trim() || '...';
    var now = new Date(), start = parse($('inStart').value), kk = parse($('inKK').value), wed = parse($('inWed').value);

    if (start && start <= now) {
      tiles($('up'), parts(start, now));
      days($('upDays'), 'عدّى', Math.floor((now - start) / DAY));
      $('upNote').textContent = 'من ' + dateAr(start);
    } else {
      tiles($('up'), ZERO);
      $('upDays').textContent = '';
      $('upNote').textContent = start ? 'التاريخ ده لسه جاي' : 'اختار أول يوم ليكم مع بعض';
    }

    cell('kk', kk, start, now, 'بقالنا كاتبين الكتاب', 'فاضل على كتب الكتاب', $('inKKword').value.trim());
    var pw = cell('w', wed, start, now, 'بقالنا متجوزين', 'فاضل على فرحنا', $('inWword').value.trim());
    state.pw = pw;
    state.pouring = pw > 0 && pw < 1;

    // sand piles up in the bottom box
    $('fillBot').style.height = (pw * 100) + '%';
    $('dropBot').hidden = !state.pouring;
    if (reduce) draw(0, 0);
  }

  // ---- sand: surface shapes + falling grains, redrawn every frame ----
  var grainsG = $('grains'), grains = [], NS = 'http://www.w3.org/2000/svg';
  for (var gi = 0; gi < 34; gi++) {
    var r = document.createElementNS(NS, 'rect');
    r.setAttribute('class', 'grain'); r.setAttribute('width', '1'); r.setAttribute('height', '2.4');
    r.setAttribute('visibility', 'hidden');
    grainsG.appendChild(r);
    grains.push({ el: r, y: 180, vy: 0, x: 120, vx: 0, wait: Math.random() * 1.1 });
  }
  var lastT = 0;
  function draw(t, dt) {
    var sec = t / 1000, pw = state.pw, pouring = state.pouring;
    var topH = 156 * (1 - pw), botH = 156 * pw;
    var yt = 180 - topH, yb = 340 - botH;
    var wob = pouring && !reduce ? Math.sin(sec * 5.3) * 0.8 : 0;
    var dip = pouring ? 11 + (reduce ? 0 : Math.sin(sec * 2.7) * 1.4) : 6;
    var peak = yb - 13 + wob;
    $('sandTop').setAttribute('d', topH > 0.5 ? 'M0 183 V' + (yt - 5) + ' Q92 ' + (yt - 4) + ' 120 ' + (yt + dip) + ' Q148 ' + (yt - 4) + ' 240 ' + (yt - 5) + ' V183 Z' : '');
    $('sandBottom').setAttribute('d', botH > 0.5 ? 'M0 342 V' + (yb + 9) + ' Q66 ' + (yb + 7) + ' 120 ' + peak + ' Q174 ' + (yb + 7) + ' 240 ' + (yb + 9) + ' V342 Z' : '');
    var st = $('stream');
    if (pouring) { st.removeAttribute('hidden'); st.setAttribute('y2', peak); } else st.setAttribute('hidden', '');
    for (var i = 0; i < grains.length; i++) {
      var g = grains[i];
      if (!pouring || reduce) { g.el.setAttribute('visibility', 'hidden'); continue; }
      if (g.wait > 0) { g.wait -= dt; g.el.setAttribute('visibility', 'hidden'); continue; }
      g.vy += 560 * dt; g.y += g.vy * dt; g.x += g.vx * dt;
      if (g.y >= peak) {
        g.y = 179; g.vy = 30 + Math.random() * 50; g.x = 120 + (Math.random() - 0.5) * 2.2;
        g.vx = (Math.random() - 0.5) * 2.5; g.wait = Math.random() * 0.12;
        g.el.setAttribute('visibility', 'hidden');
        continue;
      }
      g.el.setAttribute('visibility', 'visible');
      g.el.setAttribute('x', g.x.toFixed(2));
      g.el.setAttribute('y', g.y.toFixed(2));
    }
  }
  function frame(now) {
    var dt = Math.min(0.05, lastT ? (now - lastT) / 1000 : 0.016);
    lastT = now;
    draw(now, dt);
    requestAnimationFrame(frame);
  }

  // ---- photo slideshow with birds circling the frame ----
  var imgs = Array.prototype.slice.call(document.querySelectorAll('#photos img'));
  var dots = $('dots'), cur = 0, timer = 0, birdsEl = $('birds'), wrap = $('photoWrap');
  imgs.forEach(function () { dots.appendChild(document.createElement('i')); });
  var BIRD = '<svg viewBox="0 0 30 20" width="30" height="20"><ellipse cx="14" cy="11" rx="8" ry="3.8"/><circle cx="22.5" cy="9" r="3"/><path d="M25 8.6 L29.6 9.7 L25 10.8Z"/><path d="M7 10 L0 6.5 L6.5 12.5Z"/><path class="wing" d="M9 10 C11 1 18 0 21.5 3 C17 4 14 7 13 10Z"/></svg>';

  function flock() {
    if (reduce || !birdsEl.animate) return;
    var w = wrap.offsetWidth, h = wrap.offsetHeight, maxRx = (document.querySelector('main').clientWidth / 2) - 20;
    var cfg = [
      { off: 20, a0: -2.5, dir: 1, dur: 2900, delay: 0 },
      { off: 34, a0: -1.7, dir: 1, dur: 3100, delay: 250 },
      { off: 27, a0: 0.9, dir: -1, dur: 3000, delay: 480 }
    ];
    cfg.forEach(function (c) {
      var el = document.createElement('div');
      el.className = 'bird'; el.innerHTML = BIRD;
      birdsEl.appendChild(el);
      var rx = Math.min(w / 2 + c.off, maxRx), ry = h / 2 + c.off * 0.85, sweep = Math.PI * 2 * 0.92, n = 36, frames = [];
      for (var k = 0; k <= n; k++) {
        var u = k / n, th = c.a0 + c.dir * sweep * u;
        var x = w / 2 + rx * Math.cos(th) - 15, y = h / 2 + ry * Math.sin(th) - 10;
        var vx = -Math.sin(th) * c.dir * rx, vy = Math.cos(th) * c.dir * ry;
        var d = vx >= 0 ? 1 : -1;
        var rot = Math.max(-55, Math.min(55, Math.atan2(vy, Math.abs(vx)) * 180 / Math.PI));
        var sc = 1.05 + 0.4 * Math.sin(Math.PI * u);
        var bob = Math.sin(u * 26) * 3;
        frames.push({
          transform: 'translate(' + x.toFixed(1) + 'px,' + (y + bob).toFixed(1) + 'px) scaleX(' + d + ') rotate(' + rot.toFixed(1) + 'deg) scale(' + sc.toFixed(2) + ')',
          opacity: u < 0.1 ? u * 10 : (u > 0.88 ? (1 - u) / 0.12 : 1),
          offset: u
        });
      }
      var a = el.animate(frames, { duration: c.dur, delay: c.delay, easing: 'ease-in-out', fill: 'both' });
      a.onfinish = function () { el.remove(); };
    });
  }

  function show(i, withBirds) {
    var prev = cur;
    cur = (i + imgs.length) % imgs.length;
    imgs.forEach(function (im, k) { im.classList.toggle('on', k === cur); });
    Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('on', k === cur); });
    if (withBirds && cur !== prev) flock();
  }
  function auto() { clearInterval(timer); if (imgs.length > 1) timer = setInterval(function () { show(cur + 1, true); }, 5500); }
  $('photos').addEventListener('click', function () { show(cur + 1, true); auto(); });
  if (imgs.length) { show(0, false); auto(); }

  load();
  ids.forEach(function (id) { $(id).addEventListener('input', function () { save(); render(); }); });
  render();
  setInterval(render, 1000);
  if (!reduce) requestAnimationFrame(frame);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
